<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
            <title>WaterBridge 테스트</title>
        <style>
            body{
                font:16px -apple-system,sans-serif;padding:24px;background:#f3f7fa;color:#16324a
            }
            button{
                display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:12px;background:#087eaa;color:white;font:inherit
            }
            pre{
                white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;border-radius:12px
            }
            input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit;border:1px solid #bacbd6;border-radius:8px}
            p{line-height:1.6}
        </style>
    </head>
    <body>
        <h1>웹 ↔ 네이티브</h1>
        <p>Bridge 채널의 postMessage를 호출하고 네이티브 응답을 확인합니다. 로그 콘솔에서도 요청과 응답을 볼 수 있습니다.</p>
        
        <button data-api="routeApiList">지원 API 목록</button>
        <button data-api="nativeInfo">네이티브 정보</button>
        <button data-api="appInfo">앱 정보 · 커스텀 Route</button>
        <label for="destination-url">이동할 웹 URL</label>
        <input id="destination-url" type="url" value="https://example.com" autocapitalize="off" spellcheck="false">
        <button data-api="openSafari">외부 브라우저로 열기</button>
        <button data-api="openWebView">앱 내부 웹뷰로 열기</button>
        <button data-api="exit">앱 종료 · 확인 다이얼로그</button>
        <button data-api="unknownAPI">미지원 API 응답</button>
        
        <pre id="result" aria-live="polite">버튼을 선택하세요.</pre>
        
        <script>
            document.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', async () => {
                    const output = document.getElementById('result');
                    try {
                        const handler = window.webkit?.messageHandlers?.Bridge;
                        if (!handler) throw new Error('WaterBridgeExample 앱의 웹뷰에서 열어주세요.');
                        const api = 'water://' + button.dataset.api;
                        const opensPage = ['openSafari', 'openWebView'].includes(button.dataset.api);
                        const message = opensPage
                            ? api + '?url=' + encodeURIComponent(document.getElementById('destination-url').value)
                            : {api, data: {source: 'bridge-demo'}};
                        const response = await handler.postMessage(message);
                        output.textContent = JSON.stringify(response, null, 2);
                    } catch (error) { output.textContent = error.message; }
                });
            });
        </script>
    </body>
</html>
